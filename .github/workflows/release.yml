# Builds Spamsly.exe on every push to main and publishes it as the latest
# GitHub Release, so the README download link always points at the newest build.
name: Build and release

on:
  push:
    branches: [main, master]
    paths:
      - "spamsly.py"
      - "assets/**"
      - "requirements.txt"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller==6.22.3

      - name: Build exe
        run: >
          pyinstaller --noconfirm --onefile --windowed
          --name Spamsly
          --icon assets/app.ico
          spamsly.py

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Spamsly build ${{ github.run_number }}
          body: |
            Download **Spamsly.exe** below and double-click it. No install needed.
            Built from ${{ github.sha }}.
          files: dist/Spamsly.exe
          make_latest: true
